<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sivagiri Connect - Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="bg-dark text-white py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <h4 class="mb-0">Sivagiri Connect</h4>
      <nav>
        <a href="#" class="btn btn-outline-light btn-sm">Directory</a>
        <a href="#" class="btn btn-warning btn-sm ms-2">Marketplace</a>
      </nav>
    </div>
  </header>

  <section class="hero text-center text-white d-flex align-items-center">
    <div class="container">
      <h1 class="display-6">A platform to explore and elevate your local.</hh1>
      <p class="lead">Built by our village, for our village — and soon, for the world to see.</p>
      <div class="d-flex justify-content-center gap-2 mt-3">
        <button class="btn btn-outline-light btn-sm">Local Businesses</button>
        <button class="btn btn-outline-light btn-sm">Skilled Professionals</button>
        <button class="btn btn-outline-light btn-sm">Public Services</button>
        <button class="btn btn-outline-light btn-sm">Emergency Help</button>
      </div>
    </div>
  </section>

  <section class="search-bar py-4">
    <div class="container">
      <div class="row g-2 align-items-center">
        <div class="col-md-8">
          <input id="q" class="form-control" placeholder="Search products, services, categories...">
        </div>
        <div class="col-md-3">
          <select id="category" class="form-select">
            <option>All Categories</option>
            <option>Business</option>
            <option>Transport</option>
            <option>Healthcare</option>
            <option>Salon</option>
          </select>
        </div>
        <div class="col-md-1">
          <button id="searchBtn" class="btn btn-dark w-100">Search</button>
        </div>
      </div>
    </div>
  </section>

  <main class="container py-4">
    <div class="row g-4" id="listings">
      <!-- Listings will be rendered dynamically from data/listings.json -->
      <div class="col-12 text-center text-muted" id="loader">Loading listings…</div>
    </div>
  </main>

  <button id="chatBtn" class="chat-btn">Ask Arun</button>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
 <script src="js/scripts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
